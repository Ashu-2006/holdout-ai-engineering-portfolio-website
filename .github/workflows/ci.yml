# Build and typecheck on every push and PR.
#
# Deliberately minimal: the two commands that catch real breakage. The
# build also runs `prebuild`, which regenerates the mock imagery and the
# resume PDF, so a change that breaks either generator fails here rather
# than at deploy.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build
